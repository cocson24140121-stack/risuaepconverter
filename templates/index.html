<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>risuaepconverter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #131b2e;
      border: 1px solid #243250;
      border-radius: 14px;
      padding: 36px 30px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #60a5fa;
      text-align: center;
      letter-spacing: -0.5px;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 0.85rem;
      text-align: center;
      margin-top: -6px;
      margin-bottom: 24px;
    }
    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: block;
    }
    input[type="file"], select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      background-color: #0b0f17;
      border: 1px solid #243250;
      color: #e2e8f0;
      outline: none;
      font-size: 0.9rem;
    }
    input[type="file"]::file-selector-button {
      background-color: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 10px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    button:hover {
      opacity: 0.9;
    }
    .note {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin-top: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>risuaepconverter</h1>
    <p class="subtitle">Convert & Downgrade After Effects Projects (.aep)</p>
    <form method="POST" enctype="multipart/form-data">
      <label>Choose .aep Project File</label>
      <input type="file" name="file" accept=".aep" required>

      <label>Target AE Version</label>
      <select name="target_version">
        <option value="24.x">AE 2024 (24.x)</option>
        <option value="23.x">AE 2023 (23.x)</option>
        <option value="22.x">AE 2022 (22.x)</option>
        <option value="18.x">AE 2021 (18.x)</option>
        <option value="17.x">AE 2020 (17.x)</option>
        <option value="16.x">AE CC 2019 (16.x)</option>
        <option value="15.x">AE CC 2018 (15.x)</option>
      </select>

      <button type="submit">Convert & Download</button>
    </form>
    <div class="note">Files are processed in-memory and never saved to the server.</div>
  </div>
</body>
</html>
